# Modified from Hy4ri/hermes-mobile for this fork; see NOTICE.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v1.2.3)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed Hermes Mobile APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant execute permission for Gradle wrapper
        run: chmod 0755 gradlew

      - name: Determine version
        id: version
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$DISPATCH_TAG
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          if ! printf '%s\n' "$TAG" |
            grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi
          VERSION=${TAG#v}
          IFS=. read -r MAJOR MINOR PATCH <<EOF
          $VERSION
          EOF
          if [ "$MINOR" -gt 999 ] || [ "$PATCH" -gt 999 ]; then
            echo "Minor and patch versions must be at most 999" >&2
            exit 1
          fi
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if [ "$CODE" -le 0 ] || [ "$CODE" -gt 2147483647 ]; then
            echo "Calculated Android version code is out of range" >&2
            exit 1
          fi
          COMMIT=$(git rev-parse HEAD)
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "code=$CODE"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"
          echo "Release version=$VERSION code=$CODE commit=$COMMIT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" |
            base64 -d > "$RUNNER_TEMP/hermes-pocket-release.keystore"

      - name: Build signed Hermes release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/hermes-pocket-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleHermesRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Verify and package APK
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          mkdir -p release
          APK=app/build/outputs/apk/hermes/release/app-hermes-release.apk
          OUT=release/hermes-pocket-$RELEASE_TAG.apk
          cp "$APK" "$OUT"
          APKSIGNER=$(
            find "$ANDROID_HOME/build-tools" \
              -maxdepth 2 -name apksigner -type f |
              sort |
              tail -n 1
          )
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "No executable apksigner found under build-tools" >&2
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" |
            tee release/apksigner-verification.txt

          EXPECTED_CERT=$(
            openssl x509 \
              -in signing/hermes-pocket-release-certificate.pem \
              -noout \
              -fingerprint \
              -sha256
          )
          EXPECTED_CERT=${EXPECTED_CERT#*=}
          EXPECTED_CERT=$(
            printf '%s' "$EXPECTED_CERT" |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )

          # Build Tools 36 prefixes the digest with "Signer #1" while 37
          # prefixes it with the signature scheme (for example, "V2 Signer").
          # Parse the stable suffix and collapse identical digests that may be
          # reported once per verified signature scheme.
          ACTUAL_CERTS=$(
            sed -n 's/^.*certificate SHA-256 digest: //p' \
              release/apksigner-verification.txt |
              tr '[:upper:]' '[:lower:]' |
              sort -u
          )
          ACTUAL_CERT_COUNT=$(
            printf '%s\n' "$ACTUAL_CERTS" |
              sed '/^$/d' |
              wc -l |
              tr -d ' '
          )
          ACTUAL_CERT=$(
            printf '%s\n' "$ACTUAL_CERTS" |
              sed -n '1p'
          )
          SIGNER_COUNT=$(
            sed -n 's/^Number of signers: //p' \
              release/apksigner-verification.txt |
              tail -n 1
          )

          if [ "$SIGNER_COUNT" != 1 ] ||
            [ "$ACTUAL_CERT_COUNT" != 1 ] ||
            [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "APK signing certificate does not match the pinned identity" >&2
            exit 1
          fi

          (
            cd release
            sha256sum "hermes-pocket-$RELEASE_TAG.apk" \
              > "hermes-pocket-$RELEASE_TAG.apk.sha256"
          )
          cp LICENSE NOTICE SIGNING.md release/
          cp signing/hermes-pocket-release-certificate.pem release/
          {
            echo "versionName=${{ steps.version.outputs.version }}"
            echo "versionCode=${{ steps.version.outputs.code }}"
            echo "commit=${{ steps.version.outputs.commit }}"
          } > release/provenance.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-pocket-release
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hermes-pocket-release.keystore"

  publish:
    name: Publish GitHub release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hermes-pocket-release
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.build-release.outputs.release_tag }}
          name: Hermes Mobile ${{ needs.build-release.outputs.release_tag }}
          generate_release_notes: true
          draft: false
          files: |
            release/hermes-pocket-${{ needs.build-release.outputs.release_tag }}.apk
            release/hermes-pocket-${{ needs.build-release.outputs.release_tag }}.apk.sha256
            release/apksigner-verification.txt
            release/provenance.txt
            release/LICENSE
            release/NOTICE
            release/SIGNING.md
            release/hermes-pocket-release-certificate.pem
